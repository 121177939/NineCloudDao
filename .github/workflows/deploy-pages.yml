name: Deploy NineCloudDao V2.0.10 CACHE102 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify repository Pages workflow is clean
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          printf 'Current root workflows:\n%s\n' "${workflows[*]}"
          allowed='deploy-pages.yml release-apk.yml'
          for f in "${workflows[@]}"; do
            case "$f" in
              deploy-pages.yml|release-apk.yml) ;;
              *)
                echo "::error::发现旧/额外工作流 .github/workflows/$f。请删除它，避免旧Pages流程再次覆盖当前站点。允许的根工作流只有：$allowed"
                exit 1
                ;;
            esac
          done
          test -f .github/workflows/deploy-pages.yml
          test -f .github/workflows/release-apk.yml

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          test -f tools/build_pages_v2_0_10.py
          test -f VERSION.txt
          grep -F "V2.0.10 CACHE102" VERSION.txt
          grep -F "PAGES_DEPLOY default-github-pages-artifact-r2" VERSION.txt

      - name: Verify web and Android embedded game stay synchronized
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_web_android_sync.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js config.js update-guard.js sw.js b-paigow01.js b-equipment01.js b-secret-realm01.js b-sect-v2.js paigow-realtime.js paigow-app.js b-paigow02-ui.js; do
            node --check "$f"
          done

      - name: Build lean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          python3 tools/build_pages_v2_0_10.py . .pages-site
          test -f .pages-site/index.html
          test -f .pages-site/.nojekyll
          test -f .pages-site/VERSION.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 恢复V1.8.2时期已验证成功的默认Artifact方式。
      # 不再自定义name，也不在deploy-pages中指定artifact_name。
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages is V2.0.10 CACHE102
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          test -n "$base"
          echo "Verifying live site: $base"
          ok=0
          for i in $(seq 1 18); do
            stamp="${RUN_ID}-${RUN_ATTEMPT}-${i}-$(date +%s)"
            version_url="$base/VERSION.txt?pages_verify=$stamp"
            index_url="$base/index.html?pages_verify=$stamp"
            version="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$version_url" 2>/dev/null || true)"
            index="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$index_url" 2>/dev/null || true)"
            if grep -Fq 'V2.0.10 CACHE102' <<<"$version" \
              && grep -Fq 'PAGES_DEPLOY default-github-pages-artifact-r2' <<<"$version" \
              && grep -Fq '<!-- version: V2.0.10 CACHE102 -->' <<<"$index"; then
              echo "LIVE PAGES PASS: V2.0.10 CACHE102 / default artifact R2"
              ok=1
              break
            fi
            echo "Attempt $i: Pages CDN尚未返回本次版本，10秒后重试。"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::部署步骤结束后，线上Pages仍未读到V2.0.10 CACHE102 R2。请检查 Settings → Pages → Source 是否为 GitHub Actions，以及仓库是否残留旧Pages工作流。"
            exit 1
          fi
