name: Deploy NineCloudDao to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Show pinned toolchain
        run: |
          python --version
          node --version

      - name: Verify V0.13.1 release metadata
        run: python tools/verify_release_v0131.py .

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check config.js
          node --check sw.js
          node --check tools/test_market_render_v0130.js

      - name: V0.13.0 SQL static audit
        run: python tools/sql_static_audit_v0130.py .

      - name: Market render simulation
        run: node tools/test_market_render_v0130.js .

      - name: Build clean Pages staging directory
        run: python tools/prepare_pages_site_v0131.py . .pages-site

      - name: Verify Pages staging directory
        run: python tools/verify_pages_site_v0131.py .pages-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
