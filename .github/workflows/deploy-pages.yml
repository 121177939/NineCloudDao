name: Deploy NineCloudDao V2.0.4 CACHE96 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify repository package structure
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $PWD"
          test -f index.html
          test -f tools/build_pages_v2_0_4_actions.py
          test -f .nojekyll
          test -f .github/workflows/deploy-pages.yml
          echo "Required repository files are present."

      - name: Restore Pages source to GitHub Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/pages"
          current="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "$api" --jq '.build_type' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            echo "Pages site is not initialized; enabling GitHub Actions publishing."
            gh api --method POST \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" -f build_type=workflow >/dev/null
          elif [ "$current" != "workflow" ]; then
            echo "Pages source is '$current'; restoring it to GitHub Actions."
            gh api --method PUT \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" -f build_type=workflow >/dev/null
          else
            echo "Pages source is already GitHub Actions."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js config.js update-guard.js sw.js b-paigow01.js b-equipment01.js b-secret-realm01.js b-sect-v2.js paigow-realtime.js paigow-app.js b-paigow02-ui.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Build lean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          python3 tools/build_pages_v2_0_4_actions.py . .pages-site
          test -f .pages-site/index.html
          test -f .pages-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 30
          reporting_interval: 5000
