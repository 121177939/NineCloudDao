name: Deploy NineCloudDao V2.0.5 CACHE97 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 使用新的并发组，避免被此前卡住的 pages 队列继续阻塞。
concurrency:
  group: "nineclouddao-pages-v205-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify repository package structure
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $PWD"
          test -f index.html
          test -f tools/build_pages_v2_0_5_actions.py
          test -f .nojekyll
          test -f .github/workflows/deploy-pages.yml
          echo "Required repository files are present."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js config.js update-guard.js sw.js b-paigow01.js b-equipment01.js b-secret-realm01.js b-sect-v2.js paigow-realtime.js paigow-app.js b-paigow02-ui.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Build lean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          python3 tools/build_pages_v2_0_5_actions.py . .pages-site
          test -f .pages-site/index.html
          test -f .pages-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # 不再引用已经被旧任务卡住的 github-pages 环境。
    # deploy-pages 官方允许使用不同环境名；首次运行会自动创建干净环境。
    environment:
      name: nineclouddao-pages-live
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
