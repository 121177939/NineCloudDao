name: Deploy NineCloudDao V2.0.9 CACHE101 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          test -f tools/build_pages_v2_0_9_actions.py
          test -f VERSION.txt
          grep -F "V2.0.9 CACHE101" VERSION.txt

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js config.js update-guard.js sw.js b-paigow01.js b-equipment01.js b-secret-realm01.js b-sect-v2.js paigow-realtime.js paigow-app.js b-paigow02-ui.js; do
            node --check "$f"
          done

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          python3 tools/build_pages_v2_0_9_actions.py . .pages-site
          test -f .pages-site/index.html
          test -f .pages-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pages-site
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1800000
          reporting_interval: 10000
          error_count: 30
