name: Deploy NineCloudDao V2.1.1 CACHE112 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify no competing Pages workflow is active
        shell: bash
        run: |
          set -euo pipefail
          echo "Root workflows:"
          find .github/workflows -maxdepth 1 -type f -printf '  %f\n' | sort || true
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              deploy-pages.yml|release-apk.yml|reset-pages-deployments.yml)
                continue
                ;;
            esac
            if grep -Eq 'actions/(deploy-pages|upload-pages-artifact|configure-pages)@|pages:[[:space:]]*write|environment:[[:space:]]*github-pages' "$f"; then
              echo "::error::发现另一条可能发布 GitHub Pages 的工作流：$f。请停用或删除它，避免覆盖当前站点。"
              exit 1
            fi
            echo "::warning::发现额外但未检测到 Pages 发布动作的工作流：$f；本次不阻止部署。"
          done
          if [ -f .github/workflows/reset-pages-deployments.yml ]; then
            grep -Fq 'LEGACY_PAGES_RESET_DISABLED_V211_R3' .github/workflows/reset-pages-deployments.yml || {
              echo "::error::reset-pages-deployments.yml 不是锁定的安全占位文件。请用本版本仓库包覆盖该文件。"
              exit 1
            }
          fi

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          test -f tools/build_pages_v2_1_1_cache112.py
          test -f VERSION.txt
          grep -F "V2.1.1 CACHE112" VERSION.txt
          grep -F "PAGES_DEPLOY default-github-pages-artifact-r3" VERSION.txt

      - name: Verify web and Android embedded game stay synchronized
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_web_android_sync.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js config.js update-guard.js sw.js b-paigow01.js b-equipment01.js b-equipment-v210.js b-secret-realm01.js b-world-boss01.js b-sect-v2.js paigow-realtime.js paigow-app.js b-paigow02-ui.js; do
            node --check "$f"
          done

      - name: Build lean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          python3 tools/build_pages_v2_1_1_cache112.py . .pages-site
          test -f .pages-site/index.html
          test -f .pages-site/.nojekyll
          test -f .pages-site/VERSION.txt
          test -f .pages-site/b-world-boss01.js
          test -f .pages-site/b-equipment-v210.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages is V2.1.1 CACHE112 PERF2_DBCAP03
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          test -n "$base"
          echo "Verifying live site: $base"
          ok=0
          for i in $(seq 1 18); do
            stamp="${RUN_ID}-${RUN_ATTEMPT}-${i}-$(date +%s)"
            version_url="$base/VERSION.txt?pages_verify=$stamp"
            index_url="$base/index.html?pages_verify=$stamp"
            version="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$version_url" 2>/dev/null || true)"
            index="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$index_url" 2>/dev/null || true)"
            if grep -Fq 'V2.1.1 CACHE112' <<<"$version" \
              && grep -Fq 'PAGES_DEPLOY default-github-pages-artifact-r3' <<<"$version" \
              && grep -Fq '<!-- version: V2.1.1 CACHE112 -->' <<<"$index"; then
              echo "LIVE PAGES PASS: V2.1.1 CACHE112 / default artifact R3 / PERF2_DBCAP03"
              ok=1
              break
            fi
            echo "Attempt $i: Pages CDN尚未返回本次版本，10秒后重试。"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::部署完成后线上仍未读到V2.1.1 CACHE112。请确认 Settings → Pages → Source = GitHub Actions，并查看本次 deploy 步骤输出的 page_url。"
            exit 1
          fi
