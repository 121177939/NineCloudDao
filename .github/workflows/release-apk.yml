name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release标签；留空使用 v2.0.7-cache99"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="v2.0.7-cache99"
          fi
          case "$TAG" in v*) ;; *) echo "Release标签必须以v开头" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore official Gradle 8.2.1 Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_PATH="android/gradle/wrapper/gradle-wrapper.jar"
          WRAPPER_URL="https://services.gradle.org/distributions/gradle-8.2.1-wrapper.jar"
          EXPECTED_SHA256="a8451eeda314d0568b5340498b36edf147a8f0d692c5ff58082d477abe9146e4"
          TEMP_FILE="$(mktemp)"
          trap 'rm -f "$TEMP_FILE"' EXIT

          curl --fail --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            "$WRAPPER_URL" -o "$TEMP_FILE"

          ACTUAL_SHA256="$(sha256sum "$TEMP_FILE" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "官方Gradle Wrapper校验失败" >&2
            echo "expected=$EXPECTED_SHA256" >&2
            echo "actual=$ACTUAL_SHA256" >&2
            exit 1
          fi

          install -m 0644 "$TEMP_FILE" "$WRAPPER_PATH"
          echo "$EXPECTED_SHA256  $WRAPPER_PATH" | sha256sum --check --strict -

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/signing.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate Android project
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py

      - name: Build signed release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease \
            -PGITHUB_OWNER="${{ github.repository_owner }}" \
            -PGITHUB_REPO="${{ github.event.repository.name }}"

      - name: Prepare update files
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk release-dist/jiuxiao-wendao-release.apk
          SHA256="$(sha256sum release-dist/jiuxiao-wendao-release.apk | awk '{print $1}')"
          python3 tools/create_update_manifest.py --sha256 "$SHA256"
          sha256sum \
            release-dist/jiuxiao-wendao-release.apk \
            release-dist/app-update.json \
            > release-dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "九霄问道 $TAG" \
              --notes-file android/release/release-notes.txt
          fi
          gh release upload "$TAG" \
            android/release-dist/jiuxiao-wendao-release.apk \
            android/release-dist/app-update.json \
            android/release-dist/SHA256SUMS.txt \
            --clobber
