org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# 第一次正式发布前必须确认下面三项；应用包名一旦公开发布就不要再改。
APP_ID=com.jiuxiaowendao.game
APP_VERSION_CODE=2001203
APP_VERSION_NAME=2.0.11-cache103

# Android Studio本地构建可在这里填写仓库。GitHub Actions正式构建会自动写入当前仓库owner/repo。
GITHUB_OWNER=YOUR_GITHUB_NAME
GITHUB_REPO=YOUR_REPOSITORY
