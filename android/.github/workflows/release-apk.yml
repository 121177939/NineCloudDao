name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release标签；留空时自动使用 gradle.properties 中的版本名"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME";
          elif [ -n "${MANUAL_TAG:-}" ]; then TAG="$MANUAL_TAG";
          else VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME"{print $2}' gradle.properties | tr -d '\r')"; test -n "$VERSION_NAME"; TAG="v$VERSION_NAME"; fi
          case "$TAG" in v*) ;; *) echo "Release标签必须以v开头" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify bundled Gradle bootstrap and configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -x gradlew || chmod +x gradlew
          echo "613f321ad9687358566e3b3322bc789e4347f871823e4ca29e8b6e3b6ade4703  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -
          grep -Fq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'distributionSha256Sum=03ec176d388f2aa99defcadc3ac6adf8dd2bce5145a129659537c0874dea5ad1' gradle/wrapper/gradle-wrapper.properties

      - name: Verify preinstalled Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          for file in "$SDK_ROOT/platforms/android-34/android.jar" "$SDK_ROOT/build-tools/34.0.0/aapt2" "$SDK_ROOT/build-tools/34.0.0/apksigner" "$SDK_ROOT/platform-tools/adb"; do
            test -e "$file" || { echo "::error::Missing Android SDK file: $file"; exit 1; }
          done

      - name: Validate Android project before injecting signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/validate_project.py
          python3 tools/validate_project.py

      - name: Decode and verify permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"; test -n "$ANDROID_KEY_ALIAS"; test -n "$ANDROID_KEYSTORE_PASSWORD"; test -n "$ANDROID_KEY_PASSWORD"
          rm -f release.keystore signing.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list -keystore release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > signing.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleRelease -PGITHUB_OWNER="${{ github.repository_owner }}" -PGITHUB_REPO="${{ github.event.repository.name }}"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f release.keystore signing.properties

      - name: Prepare update files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-dist; mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk release-dist/jiuxiao-wendao-release.apk
          SHA256="$(sha256sum release-dist/jiuxiao-wendao-release.apk | awk '{print $1}')"
          python3 tools/create_update_manifest.py --sha256 "$SHA256"
          sha256sum release-dist/jiuxiao-wendao-release.apk release-dist/app-update.json > release-dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/jiuxiao-release-notes.txt"
          if [ -s release/release-notes.txt ]; then cp release/release-notes.txt "$NOTES_FILE"; else echo "九霄问道 $TAG" > "$NOTES_FILE"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --title "九霄问道 $TAG" --notes-file "$NOTES_FILE"; else gh release create "$TAG" --target "$GITHUB_SHA" --title "九霄问道 $TAG" --notes-file "$NOTES_FILE"; fi
          gh release upload "$TAG" release-dist/jiuxiao-wendao-release.apk release-dist/app-update.json release-dist/SHA256SUMS.txt --clobber

      - name: Verify published Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq 'jiuxiao-wendao-release.apk' <<<"$ASSETS"
          grep -Fxq 'app-update.json' <<<"$ASSETS"
          grep -Fxq 'SHA256SUMS.txt' <<<"$ASSETS"
