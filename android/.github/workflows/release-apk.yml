name: Build and publish Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release标签；留空使用 v2.0.5-cache97"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$MANUAL_TAG" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="v2.0.5-cache97"
          fi
          case "$TAG" in v*) ;; *) echo "Release标签必须以v开头" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate project
        run: python3 tools/validate_project.py

      - name: Build signed release APK with this repository as update source
        run: >-
          ./gradlew --no-daemon clean assembleRelease
          -PGITHUB_OWNER="${{ github.repository_owner }}"
          -PGITHUB_REPO="${{ github.event.repository.name }}"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk release-dist/jiuxiao-wendao-release.apk
          SHA256=$(sha256sum release-dist/jiuxiao-wendao-release.apk | awk '{print $1}')
          python3 tools/create_update_manifest.py --sha256 "$SHA256"
          sha256sum release-dist/jiuxiao-wendao-release.apk release-dist/app-update.json > release-dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "九霄问道 $TAG" --notes-file release/release-notes.txt
          fi
          gh release upload "$TAG" \
            release-dist/jiuxiao-wendao-release.apk \
            release-dist/app-update.json \
            release-dist/SHA256SUMS.txt \
            --clobber
