name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release标签；留空时自动使用 android/gradle.properties 中的版本名"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"
          else
            VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME"{print $2}' android/gradle.properties | tr -d '\r')"
            test -n "$VERSION_NAME"
            TAG="v$VERSION_NAME"
          fi
          case "$TAG" in v*) ;; *) echo "Release标签必须以v开头" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify bundled Gradle bootstrap and configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -x android/gradlew || chmod +x android/gradlew

          echo "613f321ad9687358566e3b3322bc789e4347f871823e4ca29e8b6e3b6ade4703  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --strict -

          grep -Fq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'distributionSha256Sum=03ec176d388f2aa99defcadc3ac6adf8dd2bce5145a129659537c0874dea5ad1' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify preinstalled Android SDK 34
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          REQUIRED_FILES=(
            "$SDK_ROOT/platforms/android-34/android.jar"
            "$SDK_ROOT/build-tools/34.0.0/aapt2"
            "$SDK_ROOT/build-tools/34.0.0/apksigner"
            "$SDK_ROOT/platform-tools/adb"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$file" ]; then
              echo "::error::GitHub ubuntu-24.04 runner is missing required Android SDK file: $file"
              exit 1
            fi
          done

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"
          "$SDK_ROOT/build-tools/34.0.0/aapt2" version

      # 必须先做交付包静态校验。校验器会确认仓库中没有签名敏感文件。
      # 之前的工作流先生成 release.keystore/signing.properties，再运行校验，必然自相矛盾失败。
      - name: Validate Android project before injecting signing secrets
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py

      - name: Decode and verify permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"

          rm -f android/release.keystore android/signing.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore

          # 在编译前验证密钥库密码和别名；不会输出密码或私钥内容。
          keytool -list \
            -keystore android/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          cat > android/signing.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: android
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleRelease \
            -PGITHUB_OWNER="${{ github.repository_owner }}" \
            -PGITHUB_REPO="${{ github.event.repository.name }}"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f android/release.keystore android/signing.properties

      - name: Prepare update files
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk release-dist/jiuxiao-wendao-release.apk
          SHA256="$(sha256sum release-dist/jiuxiao-wendao-release.apk | awk '{print $1}')"
          python3 tools/create_update_manifest.py --sha256 "$SHA256"
          python3 - <<'PY'
          import json
          from pathlib import Path
          props={}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  k,v=line.split("=",1); props[k.strip()]=v.strip()
          data=json.loads(Path("release-dist/app-update.json").read_text(encoding="utf-8"))
          assert data["versionCode"] == int(props["APP_VERSION_CODE"]), data
          assert data["versionName"] == props["APP_VERSION_NAME"], data
          assert data["packageName"] == props["APP_ID"], data
          print("app-update.json version/package validation OK")
          PY
          sha256sum \
            release-dist/jiuxiao-wendao-release.apk \
            release-dist/app-update.json \
            > release-dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # Release notes are optional source data. Do not fail the whole APK
          # publication merely because android/release/release-notes.txt was not
          # uploaded to the repository. Prefer the project file when present,
          # otherwise generate a safe fallback in RUNNER_TEMP.
          NOTES_FILE="$RUNNER_TEMP/jiuxiao-release-notes.txt"
          if [ -s android/release/release-notes.txt ]; then
            cp android/release/release-notes.txt "$NOTES_FILE"
          else
            VERSION_NAME="$(awk -F= '$1=="APP_VERSION_NAME"{print $2}' android/gradle.properties | tr -d '\r')"
            VERSION_CODE="$(awk -F= '$1=="APP_VERSION_CODE"{print $2}' android/gradle.properties | tr -d '\r')"
            cat > "$NOTES_FILE" <<EOF
          九霄问道 $VERSION_NAME

          - Android 正式版发布。
          - 冷启动必查一次最新 Release；失败后1分钟可重试，成功检查间隔10分钟。
          - 发现更高 versionCode 后弹窗询问是否更新。
          - APK 下载后校验 SHA-256、包名、versionCode 与签名证书。
          - 本版本 APP versionCode：$VERSION_CODE。
          - 本版本 APP versionName：$VERSION_NAME。
          EOF
          fi

          test -s android/release-dist/jiuxiao-wendao-release.apk
          test -s android/release-dist/app-update.json
          test -s android/release-dist/SHA256SUMS.txt
          test -s "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "九霄问道 $TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "九霄问道 $TAG" \
              --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" \
            android/release-dist/jiuxiao-wendao-release.apk \
            android/release-dist/app-update.json \
            android/release-dist/SHA256SUMS.txt \
            --clobber

      - name: Verify published Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS"
          grep -Fxq 'jiuxiao-wendao-release.apk' <<<"$ASSETS"
          grep -Fxq 'app-update.json' <<<"$ASSETS"
          grep -Fxq 'SHA256SUMS.txt' <<<"$ASSETS"
          echo "Release更新附件完整：$TAG"
