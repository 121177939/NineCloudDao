<!doctype html>
<html class="b-paigow02-ui b-paigow02-ui03" lang="zh-CN">

  <style id="bPaigow02Ui02Style">
/*
 * B-PAIGOW02-UI01
 * 九霄灵牌视觉重制候选层。
 * 仅覆盖现有 B-PAIGOW01 DOM；不新增 RPC、不读取私牌、不增加轮询。
 */
html.b-paigow02-ui{
  --pg02-bg:#070b08;
  --pg02-panel:#11170f;
  --pg02-panel-2:#18231a;
  --pg02-jade:#103a2c;
  --pg02-jade-deep:#08271e;
  --pg02-gold:#cda75b;
  --pg02-gold-light:#ead38f;
  --pg02-line:rgba(205,168,91,.45);
  --pg02-text:#e7dcc1;
  --pg02-muted:#9f967f;
  --pg02-danger:#b8564b;
  --pg02-success:#5f9a70;
  --pg02-screen-h:100vh;
}
html.b-paigow02-ui,
html.b-paigow02-ui body{
  min-height:100%;
  background:
    radial-gradient(ellipse at 50% -8%,rgba(80,126,105,.20),transparent 36%),
    linear-gradient(180deg,#0a0f0b 0%,#070a08 62%,#030503 100%);
  color:var(--pg02-text);
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;
}
html.b-paigow02-ui body{
  overflow-x:hidden;
  overscroll-behavior-y:contain;
}
html.b-paigow02-ui body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:
    linear-gradient(rgba(218,201,155,.024) 1px,transparent 1px),
    linear-gradient(90deg,rgba(218,201,155,.024) 1px,transparent 1px);
  background-size:24px 24px;
}
html.b-paigow02-ui .ink{display:none!important}
html.b-paigow02-ui button{touch-action:manipulation}
html.b-paigow02-ui .pg-app{min-height:var(--pg02-screen-h)}

/* 通用卡片和按钮 */
html.b-paigow02-ui .lobby-panel,
html.b-paigow02-ui .seat-shell,
html.b-paigow02-ui .panel{
  border-color:var(--pg02-line);
  background:linear-gradient(160deg,rgba(30,39,28,.97),rgba(13,20,14,.98));
  box-shadow:0 12px 34px rgba(0,0,0,.34);
}
html.b-paigow02-ui .secondary-btn,
html.b-paigow02-ui .room-actions button,
html.b-paigow02-ui .seat-back,
html.b-paigow02-ui .ghost-btn{
  border-radius:9px;
  border-color:rgba(205,168,91,.42);
  background:linear-gradient(145deg,#19251b,#0f1710);
  color:#d8ccb1;
}
html.b-paigow02-ui .create-submit,
html.b-paigow02-ui .seat-enter,
html.b-paigow02-ui .primary-btn{
  border-radius:10px;
  border-color:#e2c47b;
  background:linear-gradient(145deg,#dfbd72,#a77931);
  color:#1c1509;
  box-shadow:0 4px 10px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.22);
}
html.b-paigow02-ui .multiplier-btn,
html.b-paigow02-ui .recommend-btn,
html.b-paigow02-ui .confirm-split-btn,
html.b-paigow02-ui .banker-actions button{
  border-radius:10px;
}
html.b-paigow02-ui .multiplier-btn,
html.b-paigow02-ui .recommend-btn{
  border-color:rgba(205,168,91,.44);
  background:linear-gradient(145deg,#233a2e,#14261e);
  color:#e6d39b;
}
html.b-paigow02-ui .confirm-split-btn,
html.b-paigow02-ui .banker-actions .grab{
  border-color:#d8b768;
  background:linear-gradient(145deg,#d0ab62,#8e6528);
  color:#1b150b;
}
html.b-paigow02-ui .ready-note,
html.b-paigow02-ui .rule-preview{
  border-color:rgba(108,148,116,.46);
  background:rgba(32,63,47,.28);
  color:#b9caae;
}

/* 大厅 */
html.b-paigow02-ui .view-shell{
  width:min(1100px,calc(100% - 22px));
  padding-top:12px;
}
html.b-paigow02-ui .casino-head{
  padding:10px 4px 13px;
  border-bottom-color:rgba(205,168,91,.38);
}
html.b-paigow02-ui .casino-title .seal{
  border-radius:13px;
  border-color:#c69d50;
  background:linear-gradient(145deg,#294e3f,#10251d);
  color:#e6ca82;
  box-shadow:inset 0 0 0 2px rgba(8,19,14,.78),0 5px 13px rgba(0,0,0,.34);
}
html.b-paigow02-ui .casino-title h1{color:#e8d49b;letter-spacing:.1em}
html.b-paigow02-ui .casino-title p{color:var(--pg02-muted)}
html.b-paigow02-ui .casino-balance{
  border-radius:11px;
  border-color:rgba(205,168,91,.42);
  background:rgba(12,21,15,.82);
}
html.b-paigow02-ui .casino-balance b{color:#e8c976}
html.b-paigow02-ui .lobby-grid{grid-template-columns:360px minmax(0,1fr);gap:13px}
html.b-paigow02-ui .lobby-panel{border-radius:14px;overflow:hidden}
html.b-paigow02-ui .lobby-panel-head{
  padding:13px 15px;
  background:linear-gradient(180deg,#2c2418,#181910);
  border-bottom-color:rgba(205,168,91,.35);
}
html.b-paigow02-ui .lobby-panel-head h2{color:#e4cc89}
html.b-paigow02-ui .create-body{padding:13px}
html.b-paigow02-ui .form-block{
  margin-bottom:9px;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(125,105,67,.34);
  background:linear-gradient(145deg,rgba(25,58,44,.62),rgba(10,29,22,.72));
}
html.b-paigow02-ui .form-label{color:#d4c6a8;margin-bottom:7px}
html.b-paigow02-ui .choice span{
  min-height:48px;
  border-radius:8px;
  border-color:rgba(145,121,73,.40);
  background:#111910;
  color:#a99f88;
}
html.b-paigow02-ui .choice input:checked+span{
  border-color:#d4ad5e;
  background:linear-gradient(145deg,#d6b369,#966c2d);
  color:#1c1509;
  box-shadow:inset 0 1px rgba(255,255,255,.22);
}
html.b-paigow02-ui .base-bet-wrap input{
  border-radius:9px;
  border-color:rgba(205,168,91,.48);
  background:#0d160f;
  color:#ead49a;
}
html.b-paigow02-ui .currency-preview{
  border-radius:9px;
  border-color:rgba(205,168,91,.40);
  background:#151b12;
  color:#cfb978;
}
html.b-paigow02-ui .room-list-body{padding:12px}
html.b-paigow02-ui .room-grid{gap:9px}
html.b-paigow02-ui .room-card{
  border-radius:12px;
  border-color:rgba(130,111,73,.42);
  background:
    radial-gradient(circle at 88% 16%,rgba(222,196,127,.08),transparent 25%),
    linear-gradient(145deg,#19372a,#0c2219 70%,#10140e);
}
html.b-paigow02-ui .room-card::before{border-top-color:rgba(104,151,119,.42)}
html.b-paigow02-ui .room-title-row h3{color:#e4ce94}
html.b-paigow02-ui .room-status{
  border-radius:8px;
  color:#b7c8ad;
  background:rgba(49,89,66,.34);
}
html.b-paigow02-ui .room-status.playing{color:#e3c777;background:rgba(139,101,38,.32)}
html.b-paigow02-ui .room-tag{border-radius:7px;background:#10170f}
html.b-paigow02-ui .room-tag.gold{color:#e5c778}
html.b-paigow02-ui .lobby-note{border-radius:10px;background:#11170f}

/* 选座 */
html.b-paigow02-ui .seat-shell{border-radius:15px;overflow:hidden}
html.b-paigow02-ui .seat-head{
  background:linear-gradient(180deg,#2c2418,#181910);
  border-bottom-color:rgba(205,168,91,.35);
}
html.b-paigow02-ui .seat-table{
  border-radius:24px;
  border-color:rgba(205,168,91,.64);
  background:
    linear-gradient(rgba(218,201,155,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(218,201,155,.025) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 43%,rgba(102,155,128,.14),transparent 40%),
    linear-gradient(180deg,#164333,#0e3327 55%,#09271e);
  background-size:24px 24px,24px 24px,auto,auto;
  box-shadow:inset 0 0 42px rgba(0,17,11,.62);
}
html.b-paigow02-ui .seat-table::after{color:rgba(230,205,142,.10)}
html.b-paigow02-ui .seat-node{
  border-radius:11px;
  border-color:rgba(205,168,91,.36);
  background:rgba(12,22,15,.90);
}
html.b-paigow02-ui .seat-node .seat-avatar{
  border-color:#c99f50;
  color:#e6c878;
  background:linear-gradient(145deg,#38594a,#182b23);
}
html.b-paigow02-ui .seat-node.empty:hover,
html.b-paigow02-ui .seat-node.selected{
  border-color:#e0bd70;
  background:rgba(117,84,34,.54);
}
html.b-paigow02-ui .seat-summary{border-radius:10px;background:#11170f}

/* 实战牌桌：桌面不改变服务端状态、牌面数据与动作事件 */
html.b-paigow02-ui #gameView{min-height:var(--pg02-screen-h)}
html.b-paigow02-ui .topbar{
  width:min(1100px,calc(100% - 22px));
  padding:10px 0 8px;
  border-bottom-color:rgba(205,168,91,.36);
}
html.b-paigow02-ui .back-btn,
html.b-paigow02-ui .menu-btn{
  border-radius:10px;
  border-color:rgba(205,168,91,.43);
  background:#12180f;
  color:#e6d7b7;
}
html.b-paigow02-ui .brand-seal{
  border-radius:12px;
  border-color:#c89d50;
  background:linear-gradient(145deg,#2d4f41,#11281f);
  color:#e6c878;
}
html.b-paigow02-ui .brand-copy strong{color:#e8d49a}
html.b-paigow02-ui .balance-chip{border-radius:9px;background:#11170f}
html.b-paigow02-ui .app-shell{width:min(1100px,calc(100% - 22px));padding-top:10px}
html.b-paigow02-ui .room-strip{
  border-radius:12px;
  border-color:rgba(205,168,91,.42);
  background:linear-gradient(145deg,#2a2117,#151810);
  box-shadow:0 8px 22px rgba(0,0,0,.32);
}
html.b-paigow02-ui .mode-switch{border-radius:9px;background:#10170f}
html.b-paigow02-ui .mode-btn.active{border-radius:7px;background:rgba(190,149,74,.21);color:#e6cb87}
html.b-paigow02-ui .layout{grid-template-columns:minmax(0,1fr) 270px;gap:12px}
html.b-paigow02-ui .board-frame{
  padding:6px;
  border-radius:20px;
  border-color:rgba(205,168,91,.64);
  background:linear-gradient(145deg,#34281a,#13160f 44%,#2b2116 78%,#10130e);
  box-shadow:0 16px 42px rgba(0,0,0,.45);
}
html.b-paigow02-ui .board-frame::before{border-radius:16px}
html.b-paigow02-ui .felt{
  min-height:900px;
  border-radius:16px;
  border-color:rgba(129,171,144,.28);
  background:
    linear-gradient(rgba(224,207,158,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(224,207,158,.018) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 44%,rgba(116,174,144,.13),transparent 40%),
    linear-gradient(180deg,#174535,#0e3428 48%,#08271e 100%);
  background-size:30px 30px,30px 30px,auto,auto;
  box-shadow:inset 0 0 58px rgba(0,15,10,.58);
}
html.b-paigow02-ui .felt::before{border-color:rgba(205,168,91,.18)}
html.b-paigow02-ui .felt::after{content:"九霄灵牌";color:rgba(230,205,142,.06);font-size:58px}
html.b-paigow02-ui .seat{
  border-radius:11px;
  border-color:rgba(205,168,91,.28);
  background:linear-gradient(145deg,rgba(13,24,17,.92),rgba(8,16,11,.94));
  box-shadow:0 7px 18px rgba(0,0,0,.30);
  contain:layout paint;
}
html.b-paigow02-ui .seat.ready{border-color:rgba(104,153,116,.68)}
html.b-paigow02-ui .seat-inner{grid-template-columns:42px minmax(0,1fr) 86px}
html.b-paigow02-ui .seat.right .seat-inner{grid-template-columns:86px minmax(0,1fr) 42px}
html.b-paigow02-ui .avatar{
  border-radius:11px;
  border-color:#c89f51;
  color:#1a1308;
  background:
    radial-gradient(circle at 50% 34%,#e3c8aa 0 12%,transparent 13%),
    radial-gradient(circle at 50% 54%,#403239 0 25%,transparent 26%),
    linear-gradient(145deg,#9ca696,#41514b);
}
html.b-paigow02-ui .info strong{color:#e7dcc3}
html.b-paigow02-ui .stake-line{border-radius:7px;background:#12170f}
html.b-paigow02-ui .banker-corner{
  border-radius:8px;
  border-color:#e1c170;
  background:#8b3c31;
  color:#ffeab0;
}
html.b-paigow02-ui .mult-badge{border-radius:8px;background:linear-gradient(#d3ad59,#7e5420)}
html.b-paigow02-ui .mini-cards{contain:layout paint}

/* 骨牌：保持真实点位 DOM，仅重塑材质 */
html.b-paigow02-ui .tile3d{
  border-radius:6px;
  filter:none;
  contain:layout paint style;
}
html.b-paigow02-ui .tile-face{
  border-radius:6px;
  border:1px solid #050606;
  background:linear-gradient(90deg,#030405,#24292b 11%,#080a0b 50%,#202527 89%,#020303);
  box-shadow:0 4px 7px rgba(0,0,0,.72),inset 1px 0 rgba(145,155,158,.28),inset -2px 0 3px #000,inset 0 1px rgba(199,208,210,.16);
}
html.b-paigow02-ui .tile-front::before,
html.b-paigow02-ui .tile-back::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:4px;
  pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 28%,transparent 70%,rgba(255,255,255,.035));
  box-shadow:inset 0 0 5px #000;
}
html.b-paigow02-ui .tile-back{
  display:grid;
  place-items:center;
  color:#343a3c;
  font-size:15px;
  text-shadow:0 1px #000;
}
html.b-paigow02-ui .tile-name{color:rgba(225,217,196,.65)}
html.b-paigow02-ui .pair-type-label{color:#e3c87e;text-shadow:0 1px 2px #000}
html.b-paigow02-ui .tile3d.head-selected{
  filter:brightness(1.08);
  box-shadow:0 0 0 2px #58cfe9,0 0 11px rgba(88,207,233,.45);
}
html.b-paigow02-ui .self-zone{
  border-radius:13px;
  border-color:rgba(205,168,91,.48);
  background:linear-gradient(180deg,rgba(31,26,18,.96),rgba(13,17,11,.98));
}
html.b-paigow02-ui .self-card-note{color:#b8ad91}
html.b-paigow02-ui .phase-title{color:#e8cf85}
html.b-paigow02-ui .side-stack{gap:10px}
html.b-paigow02-ui .panel{border-radius:11px;overflow:hidden;box-shadow:none}
html.b-paigow02-ui .panel-head{background:#171a11}
html.b-paigow02-ui .metric{border-radius:8px;background:#11170f}
html.b-paigow02-ui .log-row,
html.b-paigow02-ui .rank-row{border-radius:7px;background:#11170f}
